<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahar Mini POS — Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; margin: 0;
           align-items: center; justify-content: center; background: #0b0f17; color: #e5e7eb; }
    .box { text-align: center; padding: 2rem; }
    h1 { font-size: 1.4rem; }
    p { color: #9ca3af; font-size: .95rem; }
    button { margin-top: 1rem; padding: .6rem 1.4rem; border-radius: .5rem; border: 0;
             background: #1d4ed8; color: #fff; font-size: .95rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>You are offline</h1>
    <p>Mahar Mini POS needs a connection for financial records.<br/>Transactions are never saved silently while offline.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
