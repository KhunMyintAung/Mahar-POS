<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mahar POS logo">
  <!-- Left leg of the "M" -->
  <rect x="18" y="28" width="18" height="68" rx="9" fill="#12A150"/>

  <!-- Right half of the "M", drawn as a chevron running into the card -->
  <path d="M40 32 L61 64 L82 32" fill="none" stroke="#F7941D" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small ascending bar chart sitting in the valley of the "M" -->
  <rect x="46" y="94" width="7" height="10" rx="1.5" fill="#8AD9AE"/>
  <rect x="56" y="86" width="7" height="18" rx="1.5" fill="#12A150"/>
  <rect x="66" y="78" width="7" height="26" rx="1.5" fill="#0C7A3B"/>

  <!-- Receipt / phone card -->
  <rect x="76" y="20" width="36" height="64" rx="9" fill="#FFFFFF" stroke="#F7941D" stroke-width="4"/>
  <rect x="84" y="32" width="20" height="3" rx="1.5" fill="#D6DBE1"/>
  <rect x="84" y="42" width="9" height="9" rx="2" fill="#12A150"/>
  <rect x="97" y="42" width="9" height="9" rx="2" fill="#F7941D"/>
  <rect x="84" y="55" width="9" height="9" rx="2" fill="#F7941D"/>
  <rect x="97" y="55" width="9" height="9" rx="2" fill="#12A150"/>
  <rect x="84" y="70" width="20" height="3" rx="1.5" fill="#D6DBE1"/>

  <!-- Torn receipt tab under the card -->
  <path d="M80 84 L100 84 L90 96 Z" fill="#0C7A3B"/>
</svg>
